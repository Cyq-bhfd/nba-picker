<!DOCTYPE html>
<html lang='zh-CN'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0, user-scalable=no'>
<title>NBA选人助手</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,system-ui,sans-serif;background:#1a1a2e;color:#eee;min-height:100vh;padding:8px}
h1{text-align:center;font-size:1.3em;padding:8px 0;color:#ffd700}
.style-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.style-btn{padding:10px 4px;border:2px solid #444;border-radius:8px;background:#16213e;color:#ccc;font-size:.85em;cursor:pointer;text-align:center;transition:all .2s}
.style-btn.active{border-color:#ffd700;background:#0f3460;color:#ffd700;font-weight:bold}
.status{background:#16213e;border-radius:8px;padding:8px 12px;margin-bottom:8px;display:flex;justify-content:space-between;font-size:.9em}
.status span{color:#ffd700}
.search-box{width:100%;padding:12px;border:2px solid #444;border-radius:8px;background:#16213e;color:#fff;font-size:1.1em;margin-bottom:8px}
.search-box:focus{border-color:#ffd700;outline:none}
.search-box::placeholder{color:#666}
.team-list{max-height:30vh;overflow-y:auto;margin-bottom:8px;border-radius:8px;background:#16213e}
.team-item{padding:10px 12px;border-bottom:1px solid #333;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.team-item:active{background:#0f3460}
.team-tier{font-size:.75em;padding:2px 6px;border-radius:4px;font-weight:bold}
.tier-splus{background:#ff4500;color:#fff}
.tier-s{background:#ff8c00;color:#fff}
.tier-a{background:#4caf50;color:#fff}
.tier-b{background:#2196f3;color:#fff}
.tier-c{background:#666;color:#fff}
.player-card{background:#16213e;border-radius:8px;padding:10px;margin-bottom:6px;border-left:4px solid #444}
.player-card.recommended{border-left-color:#4caf50;background:#0d2b1e}
.player-card.top-pick{border-left-color:#ffd700;background:#2b2000}
.player-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.player-name{font-weight:bold;font-size:1.1em}
.player-pos{background:#333;padding:2px 8px;border-radius:4px;font-size:.8em}
.player-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;font-size:.8em;text-align:center;color:#aaa}
.player-stats .val{color:#fff;font-weight:bold}
.player-score{text-align:right;font-size:1.2em;color:#ffd700;font-weight:bold}
.player-price{color:#ff8c00}
.selected-section{margin-top:10px}
.selected-header{font-size:1em;color:#ffd700;margin-bottom:6px}
.selected-player{background:#0f3460;border-radius:6px;padding:8px;margin-bottom:4px;display:flex;justify-content:space-between;font-size:.85em}
.selected-player .remove{color:#ff4444;cursor:pointer;padding:0 8px}
.pos-needs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.pos-tag{padding:4px 10px;border-radius:4px;font-size:.8em}
.pos-need{background:#ff4444;color:#fff}
.pos-filled{background:#4caf50;color:#fff}
.reroll-advice{padding:8px 12px;border-radius:8px;margin-bottom:8px;font-size:.9em;text-align:center;font-weight:bold}
.reroll-yes{background:#4caf50;color:#fff}
.reroll-no{background:#ff8c00;color:#fff}
.reroll-must{background:#ff4444;color:#fff}
.reroll-missing{background:#9c27b0;color:#fff}
.tier-badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.8em;font-weight:bold;margin-left:8px}
#loading{text-align:center;padding:40px;color:#888;font-size:1.1em}
#progress{color:#ffd700;margin-top:8px;font-size:.9em}
</style>
</head>
<body>
<h1>🏀 NBA选人助手</h1>
<div id='loading'>⏳ 数据加载中...<div id='progress'></div></div>
<div class='style-grid' id='styleGrid' style='display:none'></div>
<div class='status' id='statusBar' style='display:none'><div>💰 预算: <span id='budget'>29</span>金</div><div> 已选: <span id='count'>0</span>/8</div></div>
<div class='pos-needs' id='posNeeds' style='display:none'></div>
<div id='rerollAdvice' style='display:none'></div>
<input type='text' class='search-box' id='searchBox' placeholder='🔍 输入队名搜索（如：热火、湖人）' autocomplete='off' style='display:none'>
<div class='team-list' id='teamList' style='display:none'></div>
<div id='playerResults'></div>
<div class='selected-section' id='selectedSection' style='display:none'><div class='selected-header'>📋 已选阵容</div><div id='selectedList'></div></div>
<script>
var STYLES=['快攻','半场','防守','内线','策应','showtime','挡拆','双塔','跑轰'];
var POSITIONS=['PG','SG','SF','PF','C'];
var DATA={picks:{},tiers:{},teams:[]},currentStyle=null,budget=29,selected=[],posCount={PG:0,SG:0,SF:0,PF:0,C:0};
var CHUNKS=6;

function init(){
  document.getElementById('loading').style.display='none';
  document.getElementById('styleGrid').style.display='grid';
  document.getElementById('statusBar').style.display='flex';
  document.getElementById('posNeeds').style.display='flex';
  document.getElementById('searchBox').style.display='block';
  document.getElementById('teamList').style.display='block';
  document.getElementById('teamCount').textContent=DATA.teams.length;
  var grid=document.getElementById('styleGrid');
  STYLES.forEach(function(s){var btn=document.createElement('div');btn.className='style-btn';btn.textContent=s==='showtime'?'Showtime':s;btn.onclick=function(){selectStyle(s,btn)};grid.appendChild(btn)});
  updatePosNeeds();renderTeamList('');
}

function loadError(msg){document.getElementById('loading').innerHTML='✗ '+msg+'<br><div id=progress></div>';document.getElementById('progress').textContent='点击重试';document.getElementById('progress').onclick=function(){location.reload()};document.getElementById('progress').style.cursor='pointer'}

function loadChunks(){
  var progress=document.getElementById('progress');
  var loaded=0;
  var promises=[];
  for(var i=0;i<CHUNKS;i++){
    promises.push(fetch('data'+i+'.json').then(function(r){
      if(!r.ok)throw new Error('HTTP '+r.status);
      return r.json();
    }).then(function(chunk){
      loaded++;
      progress.textContent='已加载 '+loaded+'/'+CHUNKS+'...';
      DATA.teams=DATA.teams.concat(chunk.teams);
      Object.keys(chunk.picks).forEach(function(t){DATA.picks[t]=chunk.picks[t]});
      Object.keys(chunk.tiers).forEach(function(t){DATA.tiers[t]=chunk.tiers[t]});
    }));
  }
  Promise.all(promises).then(function(){
    DATA.teams.sort();
    init();
  }).catch(function(e){loadError('加载失败: '+e.message)});
}

function selectStyle(style,btn){currentStyle=style;var btns=document.querySelectorAll('.style-btn');for(var i=0;i<btns.length;i++)btns[i].classList.remove('active');btn.classList.add('active');document.getElementById('playerResults').innerHTML='';document.getElementById('rerollAdvice').style.display='none'}

function selectTeam(teamName){
  if(!currentStyle){alert('请先选择教练风格！');return}
  var picks=DATA.picks[teamName];
  if(!picks){showRerollAdvice('missing','「'+teamName+'」不在数据库，建议刷掉！');document.getElementById('playerResults').innerHTML='';return}
  var tier=DATA.tiers[teamName],players=picks[currentStyle]||[];
  var advice=getRerollAdvice(tier);
  if(advice)showRerollAdvice(advice.type,advice.text);else document.getElementById('rerollAdvice').style.display='none';
  var container=document.getElementById('playerResults');
  container.innerHTML='<div style="margin:8px 0;color:#ffd700;font-weight:bold">'+teamName+' <span class="tier-badge '+getTierClass(tier.ability)+'">'+tier.ability+'能力</span></div>';
  for(var i=0;i<players.length;i++){
    var p=players[i],affordable=p.price<=budget,isTopPick=i===0&&affordable,isRecommended=i<3&&affordable;
    var card=document.createElement('div');
    card.className='player-card'+(isTopPick?' top-pick':isRecommended?' recommended':'');
    var h='<div class="player-header"><div><span class="player-name">'+(i+1)+'. '+p.name+'</span><span class="player-pos">'+p.pos+'</span>';
    if(!affordable)h+='<span style="color:#ff4444;font-size:.8em"> ❌超预算</span>';
    if(isTopPick)h+='<span style="color:#4caf50;font-size:.8em"> 推荐</span>';
    h+='</div><div class="player-score">'+p.score+'分</div></div>';
    h+='<div style="display:flex;justify-content:space-between;margin-bottom:4px"><span class="player-price">'+p.price+'金</span><span style="color:#aaa">能力:'+p.ability+'</span></div>';
    h+='<div class="player-stats"><div>得分<br><span class="val">'+p.pts+'</span></div><div>篮板<br><span class="val">'+p.reb+'</span></div><div>助攻<br><span class="val">'+p.ast+'</span></div><div>抢断<br><span class="val">'+p.stl+'</span></div><div>盖帽<br><span class="val">'+p.blk+'</span></div></div>';
    if(affordable)h+='<button onclick="selectPlayer(\''+teamName+'\',\''+p.name+'\',\''+p.pos+'\','+p.price+','+p.ability+')" style="width:100%;margin-top:6px;padding:8px;border:none;border-radius:6px;background:#4caf50;color:#fff;font-size:1em;font-weight:bold;cursor:pointer">✅ 选他</button>';
    card.innerHTML=h;
    container.appendChild(card);
  }
}

function selectPlayer(team,name,pos,price,ability){
  if(price>budget)return;
  selected.push({team:team,name:name,pos:pos,price:price,ability:ability});budget-=price;
  if(POSITIONS.indexOf(pos)>=0)posCount[pos]++;
  document.getElementById('budget').textContent=budget;document.getElementById('count').textContent=selected.length;
  updatePosNeeds();renderSelected();document.getElementById('playerResults').innerHTML='';document.getElementById('rerollAdvice').style.display='none';document.getElementById('searchBox').value='';renderTeamList('');
  if(selected.length>=8)alert('🏆 阵容已满！总能力: '+selected.reduce(function(s,p){return s+p.ability},0).toFixed(1));
}

function removePlayer(idx){var p=selected[idx];budget+=p.price;if(POSITIONS.indexOf(p.pos)>=0)posCount[p.pos]--;selected.splice(idx,1);document.getElementById('budget').textContent=budget;document.getElementById('count').textContent=selected.length;updatePosNeeds();renderSelected()}

function updatePosNeeds(){var h='';for(var i=0;i<POSITIONS.length;i++){var pos=POSITIONS[i];h+='<span class="pos-tag '+(posCount[pos]>0?'pos-filled':'pos-need')+'">'+pos+' '+(posCount[pos]>0?'✓':'✗')+'</span>'}document.getElementById('posNeeds').innerHTML=h}

function renderSelected(){var section=document.getElementById('selectedSection'),list=document.getElementById('selectedList');if(!selected.length){section.style.display='none';return}section.style.display='block';var h='';for(var i=0;i<selected.length;i++){var p=selected[i];h+='<div class="selected-player"><span>'+p.name+'('+p.pos+') '+p.team+' '+p.price+'金 能力'+p.ability+'</span><span class="remove" onclick="removePlayer('+i+')">✕</span></div>'}h+='<div style="text-align:right;color:#ffd700;margin-top:4px">总能力: '+selected.reduce(function(s,p){return s+p.ability},0).toFixed(1)+'</div>';list.innerHTML=h}

function getTierClass(a){if(a>=50)return'tier-splus';if(a>=40)return'tier-s';if(a>=30)return'tier-a';if(a>=22)return'tier-b';return'tier-c'}

function getRerollAdvice(tier){var a=tier.ability,rd=selected.length+1;if(a>=40)return null;if(a<22)return{type:'must',text:'🔄 必刷！该队最强球员仅'+a+'能力'};if(rd<=3&&a<30)return{type:'yes',text:'🔄 建议刷掉（前期大胆刷）'};if(rd<=5&&a<25)return{type:'yes',text:'🔄 建议刷掉'};if(rd>=6)return{type:'no',text:'⚠️ 后期了别刷了，选最好的'};return{type:'no',text:'⚠️ 能力'+a+'，看预算决定'}}

function showRerollAdvice(type,text){var el=document.getElementById('rerollAdvice');el.style.display='block';el.className='reroll-advice reroll-'+type;el.textContent=text}

function renderTeamList(query){var list=document.getElementById('teamList'),teams=DATA.teams;if(query){teams=teams.filter(function(t){return t.indexOf(query)>=0})}var h='';for(var i=0;i<teams.length;i++){var t=teams[i],tier=DATA.tiers[t];h+='<div class="team-item" onclick="selectTeam(\''+t+'\')"><span>'+t+'</span><span><span class="team-tier '+getTierClass(tier.ability)+'">'+tier.ability+'</span><span style="color:#888;font-size:.8em;margin-left:4px">'+tier.best+'</span></span></div>'}list.innerHTML=h}

document.getElementById('searchBox').addEventListener('input',function(e){var q=e.target.value.trim();if(q.length>=1){var exact=DATA.teams.find(function(t){return t===q});if(exact){selectTeam(exact);renderTeamList(q);return}}renderTeamList(q);document.getElementById('playerResults').innerHTML='';document.getElementById('rerollAdvice').style.display='none'});

function resetAll(){budget=29;selected=[];posCount={PG:0,SG:0,SF:0,PF:0,C:0};document.getElementById('budget').textContent=budget;document.getElementById('count').textContent=0;updatePosNeeds();renderSelected();document.getElementById('playerResults').innerHTML='';document.getElementById('rerollAdvice').style.display='none'}

loadChunks();
</script>
<div style='text-align:center;margin-top:10px'><button onclick='resetAll()' style='padding:8px 20px;border:none;border-radius:6px;background:#ff4444;color:#fff;font-size:.9em;cursor:pointer'>🔄 重新开始</button></div>
<div style='text-align:center;color:#666;font-size:.7em;margin-top:10px'>数据: <span id='teamCount'>?</span>队 | 风格匹配为预估，实战请验证</div>
</body></html>
